apiVersion: v1
kind: ConfigMap
metadata:
  name: strimzi-kafka-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  strimzi-kafka.json: |
    {
      "annotations": { "list": [] },
      "description": "Strimzi Kafka — broker throughput, latency, consumer lag, connections, JVM",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["kafka", "strimzi"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Strimzi Kafka",
      "uid": "strimzi-kafka",
      "version": 2,
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "pluginId": "prometheus",
            "hide": 0,
            "label": "Prometheus"
          },
          {
            "name": "kubernetes_namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "query": "label_values(kafka_server_replicamanager_leadercount, namespace)",
            "refresh": 2,
            "hide": 0,
            "label": "Namespace",
            "current": { "selected": false, "text": "kafka", "value": "kafka" }
          },
          {
            "name": "strimzi_cluster_name",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "query": "label_values(kafka_server_replicamanager_leadercount{namespace=~\"$kubernetes_namespace\"}, strimzi_io_cluster)",
            "refresh": 2,
            "hide": 0,
            "label": "Cluster"
          },
          {
            "name": "kafka_broker",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "query": "label_values(kafka_server_replicamanager_leadercount{namespace=~\"$kubernetes_namespace\"}, pod)",
            "refresh": 2,
            "hide": 0,
            "label": "Broker",
            "includeAll": true,
            "multi": true,
            "allValue": ".*"
          },
          {
            "name": "kafka_topic",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "query": "label_values(kafka_server_brokertopicmetrics_messagesin_total{namespace=~\"$kubernetes_namespace\",topic!=\"__consumer_offsets\",topic!=\"__transaction_state\"}, topic)",
            "refresh": 2,
            "hide": 0,
            "label": "Topic",
            "includeAll": true,
            "multi": true,
            "allValue": ".+"
          }
        ]
      },
      "panels": [

        {
          "id": 1,
          "type": "stat",
          "title": "Brokers Online",
          "description": "Number of Kafka broker pods currently scraping metrics",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "count(kafka_server_replicamanager_leadercount{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\"})",
            "legendFormat": "Brokers",
            "refId": "A"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "green", "value": 1 }
              ]}
            }
          }
        },

        {
          "id": 2,
          "type": "stat",
          "title": "Active Controllers",
          "description": "Should always be 1",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(kafka_controller_kafkacontroller_activecontrollercount{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\"})",
            "legendFormat": "Controllers",
            "refId": "A"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "green", "value": 1 },
                { "color": "red", "value": 2 }
              ]}
            }
          }
        },

        {
          "id": 3,
          "type": "stat",
          "title": "Under-Replicated Partitions",
          "description": "Should be 0 in a healthy cluster",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(kafka_server_replicamanager_underreplicatedpartitions{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\"})",
            "legendFormat": "Under-replicated",
            "refId": "A"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 10 }
              ]}
            }
          }
        },

        {
          "id": 4,
          "type": "stat",
          "title": "Offline Partitions",
          "description": "Should always be 0",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(kafka_controller_kafkacontroller_offlinepartitionscount{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\"})",
            "legendFormat": "Offline",
            "refId": "A"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ]}
            }
          }
        },

        {
          "id": 5,
          "type": "stat",
          "title": "Total Partitions",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(kafka_server_replicamanager_partitioncount{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\"})",
            "legendFormat": "Partitions",
            "refId": "A"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "fixed", "fixedColor": "blue" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } }
          }
        },

        {
          "id": 6,
          "type": "stat",
          "title": "Active Connections",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(kafka_server_socketservermetrics_connection_count{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\"})",
            "legendFormat": "Connections",
            "refId": "A"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "fixed", "fixedColor": "purple" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "purple", "value": null }] } }
          }
        },

        {
          "id": 7,
          "type": "row",
          "title": "Throughput",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 4 },
          "collapsed": false
        },

        {
          "id": 8,
          "type": "timeseries",
          "title": "Messages In / sec (by topic)",
          "description": "Rate of messages produced per second, broken down by topic",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(rate(kafka_server_brokertopicmetrics_messagesin_total{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",topic=~\"$kafka_topic\"}[1m])) by (topic)",
            "legendFormat": "{{topic}}",
            "refId": "A"
          }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },

        {
          "id": 9,
          "type": "timeseries",
          "title": "Bytes In / sec",
          "description": "Total bytes ingested per second across all topics",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(rate(kafka_server_brokertopicmetrics_bytesin_total{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",topic=~\"$kafka_topic\"}[1m])) by (pod)",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },

        {
          "id": 10,
          "type": "timeseries",
          "title": "Bytes Out / sec",
          "description": "Total bytes sent to consumers per second",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(rate(kafka_server_brokertopicmetrics_bytesout_total{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",topic=~\"$kafka_topic\"}[1m])) by (pod)",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },

        {
          "id": 11,
          "type": "row",
          "title": "Request Latency",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "collapsed": false
        },

        {
          "id": 12,
          "type": "timeseries",
          "title": "Produce Request Latency (ms)",
          "description": "End-to-end latency for Produce requests at p50 / p95 / p99",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "kafka_network_requestmetrics_totaltimems{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",request=\"Produce\",quantile=\"0.5\"}",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "kafka_network_requestmetrics_totaltimems{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",request=\"Produce\",quantile=\"0.95\"}",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "kafka_network_requestmetrics_totaltimems{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",request=\"Produce\",quantile=\"0.99\"}",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "lineWidth": 2, "fillOpacity": 5 } } }
        },

        {
          "id": 13,
          "type": "timeseries",
          "title": "Fetch Consumer Latency (ms)",
          "description": "End-to-end latency for FetchConsumer requests at p50 / p95 / p99",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "kafka_network_requestmetrics_totaltimems{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",request=\"FetchConsumer\",quantile=\"0.5\"}",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "kafka_network_requestmetrics_totaltimems{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",request=\"FetchConsumer\",quantile=\"0.95\"}",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "kafka_network_requestmetrics_totaltimems{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",request=\"FetchConsumer\",quantile=\"0.99\"}",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "lineWidth": 2, "fillOpacity": 5 } } }
        },

        {
          "id": 14,
          "type": "row",
          "title": "Consumer Lag",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "collapsed": false
        },

        {
          "id": 15,
          "type": "timeseries",
          "title": "Consumer Group Lag (by group / topic)",
          "description": "Number of messages the consumer group is behind the latest offset. Sourced from kafka-exporter.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 23 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(kafka_consumergroup_lag{topic=~\"$kafka_topic\"}) by (consumergroup, topic)",
            "legendFormat": "{{consumergroup}} / {{topic}}",
            "refId": "A"
          }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"] } },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 15 }, "min": 0 } }
        },

        {
          "id": 16,
          "type": "row",
          "title": "Connections & Network",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 31 },
          "collapsed": false
        },

        {
          "id": 17,
          "type": "timeseries",
          "title": "Active Connections (by broker)",
          "description": "Number of open TCP connections to each broker",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "kafka_server_socketservermetrics_connection_count{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\"}",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 10 }, "min": 0 } }
        },

        {
          "id": 18,
          "type": "timeseries",
          "title": "Network Processor Avg Idle %",
          "description": "How idle the network processors are. Lower = busier broker.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "kafka_network_socketserver_networkprocessoravgidlepercent{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\"}",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "lineWidth": 2, "fillOpacity": 10 },
            "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "orange", "value": 0.3 }, { "color": "green", "value": 0.5 }] }
          } }
        },

        {
          "id": 19,
          "type": "row",
          "title": "JVM",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 40 },
          "collapsed": false
        },

        {
          "id": 20,
          "type": "timeseries",
          "title": "JVM Heap Used (by broker)",
          "description": "JVM heap memory currently in use",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 41 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "jvm_memory_bytes_used{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",area=\"heap\"}",
              "legendFormat": "{{pod}} used",
              "refId": "A"
            },
            {
              "expr": "jvm_memory_bytes_max{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\",area=\"heap\"}",
              "legendFormat": "{{pod}} max",
              "refId": "B"
            }
          ],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },

        {
          "id": 21,
          "type": "timeseries",
          "title": "GC Collection Time / sec",
          "description": "Time spent in garbage collection per second (rate). High values indicate GC pressure.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 41 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [{
            "expr": "sum(rate(jvm_gc_collection_seconds_sum{namespace=~\"$kubernetes_namespace\",pod=~\"$kafka_broker\"}[1m])) by (pod, gc)",
            "legendFormat": "{{pod}} — {{gc}}",
            "refId": "A"
          }],
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 10 }, "min": 0 } }
        }

      ]
    }
