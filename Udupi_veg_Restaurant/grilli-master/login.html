<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Guruprasad Udupi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .container {
      background: #222;
      padding: 2rem;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo h1 { color: #ff6b00; font-size: 1.5rem; }
    .logo p { color: #888; font-size: 0.9rem; }
    .tabs { display: flex; margin-bottom: 1.5rem; border-radius: 8px; overflow: hidden; }
    .tab {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      background: #333;
      border: none;
      color: #888;
      font-size: 1rem;
      transition: all 0.3s;
    }
    .tab.active { background: #ff6b00; color: #fff; }
    .form { display: none; }
    .form.active { display: block; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; color: #888; margin-bottom: 0.3rem; font-size: 0.85rem; }
    input {
      width: 100%;
      padding: 0.85rem;
      border: 1px solid #444;
      border-radius: 8px;
      background: #333;
      color: #fff;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    input:focus { outline: none; border-color: #ff6b00; }
    input::placeholder { color: #666; }
    .btn {
      width: 100%;
      padding: 0.85rem;
      background: #ff6b00;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: #ff8533; }
    .message { padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
    .message.error { background: rgba(255,68,68,0.2); color: #ff6b6b; }
    .message.success { background: rgba(68,255,68,0.2); color: #6bff6b; }
    .links { text-align: center; margin-top: 1.5rem; }
    .links a { color: #ff6b00; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🍽️ Guruprasad Udupi</h1>
      <p>South Indian Vegetarian Restaurant</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('login')">Login</button>
      <button class="tab" onclick="showTab('register')">Register</button>
    </div>

    <div id="message"></div>

    <div id="loginForm" class="form active">
      <div class="field">
        <label>Phone Number</label>
        <input type="tel" id="loginPhone" placeholder="Enter 10-digit phone" maxlength="10">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password">
      </div>
      <button class="btn" onclick="login()">Login</button>
    </div>

    <div id="registerForm" class="form">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Enter your name">
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input type="tel" id="regPhone" placeholder="Enter 10-digit phone" maxlength="10">
      </div>
      <div class="field">
        <label>Email (optional)</label>
        <input type="email" id="regEmail" placeholder="Enter email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Create a password">
      </div>
      <button class="btn" onclick="register()">Create Account</button>
    </div>

    <div class="links">
      <a href="/menu">← Back to Menu</a>
    </div>
  </div>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));

      if (tab === 'login') {
        document.querySelector('.tabs .tab:first-child').classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelector('.tabs .tab:last-child').classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
      clearMessage();
    }

    function showMessage(text, isError = false) {
      const msgDiv = document.getElementById('message');
      msgDiv.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${text}</div>`;
    }

    function clearMessage() {
      document.getElementById('message').innerHTML = '';
    }

    async function login() {
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!phone || !password) {
        showMessage('Please fill all fields', true);
        return;
      }

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('customer', JSON.stringify(data.customer));
          showMessage('Login successful! Redirecting...');
          setTimeout(() => window.location.href = '/menu', 1000);
        } else {
          showMessage(data.error, true);
        }
      } catch (err) {
        showMessage('Connection error', true);
      }
    }

    async function register() {
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (!name || !phone || !password) {
        showMessage('Name, phone and password are required', true);
        return;
      }

      if (phone.length !== 10) {
        showMessage('Phone must be 10 digits', true);
        return;
      }

      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('customer', JSON.stringify(data.customer));
          showMessage('Account created! Redirecting...');
          setTimeout(() => window.location.href = '/menu', 1000);
        } else {
          showMessage(data.error, true);
        }
      } catch (err) {
        showMessage('Connection error', true);
      }
    }

    // Enter key support
    document.getElementById('loginPassword').addEventListener('keypress', e => {
      if (e.key === 'Enter') login();
    });
    document.getElementById('regPassword').addEventListener('keypress', e => {
      if (e.key === 'Enter') register();
    });

    // Check if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/menu';
    }
  </script>
</body>
</html>
